name: CI/CD Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-orcl
  cancel-in-progress: true

jobs:
  test-package-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Package application
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Configure SSH
        env:
          ORCL_SSH_KEY: ${{ secrets.ORCL_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORCL_SSH_KEY" > ~/.ssh/orcl_key
          chmod 600 ~/.ssh/orcl_key
          ssh-keyscan -H 163.192.101.89 >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host orcl
            HostName 163.192.101.89
            User ubuntu
            IdentityFile ~/.ssh/orcl_key
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload artifacts to Oracle VM
        run: |
          set -euo pipefail
          ssh orcl 'mkdir -p ~/mad-enroll'
          scp backend/target/app.jar backend/docker-compose.yml backend/Caddyfile orcl:~/mad-enroll/

      - name: Deploy with Docker Compose
        run: |
          set -euo pipefail
          ssh orcl 'cd ~/mad-enroll && docker compose up -d --remove-orphans && docker compose up -d --no-deps --force-recreate app caddy'
