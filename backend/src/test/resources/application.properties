# Test-only configuration. On the test classpath this file shadows src/main/resources/application.properties,
# so tests never read a developer's .env, the dev profile or real Redis/RabbitMQ/SMTP settings.
# Each Spring test context gets its own in-memory database through ${random.uuid}.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
app.mail.from=noreply@example.com

# Placeholders without defaults in main code. Spring also injects them into mocked beans.
uw-api.user-agent=MadEnroll-test
app.jwt.secret=01234567890123456789012345678901
app.auth.admin.email=admin@example.com
app.auth.admin.password=admin-secret
app.rabbitmq.exchange=test.alert.exchange
app.rabbitmq.routing-key=test.alert.routing
app.rabbitmq.queue=test.alert.queue
app.rabbitmq.dlx-exchange=test.alert.dlx
app.rabbitmq.dlq-routing-key=test.alert.dlq.routing
app.rabbitmq.dlq=test.alert.dlq
